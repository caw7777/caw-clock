name: Build CAW + Home Assistant

# CAW + Home Assistant firmware: each boot runs either the CAW app (same code
# as the CAW-only firmware) or the Home Assistant dashboard engine, chosen in
# the web UI. Test image for on-device verification.

# On hold (owner, 2026-11-15): manual runs only. The CAW app has grown past
# what fits next to the Home Assistant engine (3.4 KB over the OTA limit with
# the time zone list); trim before resuming, e.g. a shorter zone list here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MINI_DISPLAY_BUILD_VERSION: caw-ha-test-1
      OTA_LIMIT: 1044464
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip -q caw-working-source.zip -d extracted
          ROOT="$(dirname "$(find extracted -name Makefile -type f -print -quit)")"
          test -f "$ROOT/firmware/src/CawStandalone/caw_standalone.cpp"
          grep -q '\[env:sdpro_caw_ha\]' "$ROOT/firmware/platformio.ini"
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install "platformio==6.1.19" "zopfli==0.4.1"

      - name: Build web panel (HTTPS and display-mode controls)
        run: |
          npm ci --prefix "$SOURCE_ROOT/firmware/web"
          npm --prefix "$SOURCE_ROOT/firmware/web" run check
          MINI_DISPLAY_FEATURE_TLS=1 MINI_DISPLAY_FEATURE_CAW=1 npm --prefix "$SOURCE_ROOT/firmware/web" run build
          python3 "$SOURCE_ROOT/firmware/scripts/embed_web.py"

      - name: Build firmware
        run: |
          set -o pipefail
          cd "$SOURCE_ROOT/firmware"
          pio run --environment sdpro_caw_ha 2>&1 | tee build.log
          if grep -q "warning:" build.log; then echo "::error::compiler warnings"; exit 1; fi

      - name: Size gate and package
        run: |
          BIN="$SOURCE_ROOT/firmware/.pio/build/sdpro_caw_ha/firmware.bin"
          SIZE=$(stat -c %s "$BIN")
          echo "firmware.bin: $SIZE bytes (limit $OTA_LIMIT, headroom $((OTA_LIMIT - SIZE)))"
          test "$SIZE" -le "$OTA_LIMIT"
          mkdir -p out
          cp "$BIN" out/caw-clock-caw-ha.bin
          (cd out && sha256sum caw-clock-caw-ha.bin | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: caw-clock-caw-ha
          path: out/
          if-no-files-found: error
          retention-days: 30
