name: Inspect CAW display renderer
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-caw-display.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print renderer source
        run: |
          mkdir -p extracted
          unzip -q caw-working-source.zip -d extracted
          ROOT="$(dirname "$(find extracted -name Makefile -type f -print -quit)")"
          echo "=== CAW MARKET FEED HEADER ==="
          sed -n '1,240p' "$ROOT/firmware/src/CawMarketFeed.h"
          echo "=== CAW MARKET FEED CPP ==="
          sed -n '1,560p' "$ROOT/firmware/src/CawMarketFeed.cpp"
          echo "=== MAIN CALL SITES ==="
          grep -n -B 8 -A 14 -E 'CawMarket|cawMarket|drawCaw|marketFeed|renderCaw' "$ROOT/firmware/src/main.cpp" | head -260
          echo "=== TIME CONFIGURATION ==="
          sed -n '400,490p' "$ROOT/firmware/src/DeviceSettings.cpp"
