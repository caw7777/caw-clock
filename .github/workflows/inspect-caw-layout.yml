name: Inspect CAW dashboard configuration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-caw-layout.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find display configuration and rendering code
        run: |
          mkdir -p extracted
          unzip -q caw-working-source.zip -d extracted
          ROOT="$(dirname "$(find extracted -name Makefile -type f -print -quit)")"
          echo "=== FILES RELATED TO DISPLAY / DASHBOARD ==="
          find "$ROOT" -type f | grep -Ei '(display|dashboard|scene|page|layout|caw)' | head -180
          echo "=== PRICE SENSOR REFERENCES ==="
          grep -Rni -E 'sensor\.caw_usd_price_display|sensor\.caw_change_24h_display|caw_ticker_display' "$ROOT" --exclude='*.zip' | head -220
          echo "=== EMBEDDED CAW DASHBOARD PAGE ==="
          sed -n '2290,2365p' "$ROOT/firmware/src/main.cpp"
          echo "=== ASSET SOURCE ==="
          sed -n '1,100p' "$ROOT/firmware/src/CawClockAssets.h"
          echo "=== PLATFORMIO CONFIG FILES ==="
          find "$ROOT" -maxdepth 4 -iname 'platformio.ini' -o -iname 'platformio*.ini'
